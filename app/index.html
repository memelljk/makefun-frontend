<!DOCTYPE html>
<html lang="en-US">
<head><meta charset="UTF-8">
<title>make.fun front — bounties, leaderboards, profiles live</title>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link href="/style.css" rel="stylesheet">

<body><a href="#view" class="skip-link">Skip to the content</a>
<header class="site-head"><div class="head-in">
<a href="#/" class="brand" aria-label="make.fun front, back to the bounty board"><span class="brand-mark" aria-hidden="true">m.</span><span class="brand-name">make.fun <em>front</em></span></a>
<nav aria-label="Main" class="site-nav"><a href="#/" data-nav="board">Bounties</a></nav>

</div></header>
<main class="view" id="view" tabindex="-1" aria-live="off">
